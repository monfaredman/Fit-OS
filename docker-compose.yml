# Local datastores. Host ports are shifted (5433 / 6380) so a Homebrew
# Postgres or Redis on the default ports does not clash — D-006.
services:
  postgres:
    image: postgres:17-alpine
    container_name: gymos_postgres
    environment:
      POSTGRES_USER: gymos
      POSTGRES_PASSWORD: gymos
      POSTGRES_DB: gymos
    ports:
      - '5433:5432'
    volumes:
      - gymos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymos -d gymos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gymos_redis
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gymos_pgdata:
